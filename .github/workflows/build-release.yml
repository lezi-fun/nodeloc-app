name: Build Release APK

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(如 v1.2.0),用于 APK/tag/Release 命名;留空则回退 commit 短哈希'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve short commit hash
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # 手动触发且填写了版本号时,APK/tag/Release 均以版本号命名。
      # 提交触发的自动构建发为 pre-release —— GitHub 的 /releases/latest 只返回
      # 最新的非 pre-release、非草稿 Release,否则每次提交都会把正式版本从 latest 顶掉,
      # 应用内的更新检查就再也看不到正式版。
      - name: Resolve release naming
        id: rel
        run: |
          version="${{ github.event.inputs.version }}"
          short="${{ steps.sha.outputs.short }}"
          if [ -n "$version" ]; then
            echo "name=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$version" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "name=$short" >> "$GITHUB_OUTPUT"
            echo "tag=build-$short" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Android project (skip until scaffold lands)
        id: guard
        run: echo "present=$([ -f gradlew ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.guard.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.guard.outputs.present == 'true'

      # 签名密钥库已固定于仓库 keystore/release.keystore(见 app/build.gradle.kts)

      - name: Run unit tests
        if: steps.guard.outputs.present == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew testReleaseUnitTest --stacktrace

      - name: Assemble release APK with version metadata
        if: steps.guard.outputs.present == 'true'
        env:
          APP_VERSION: ${{ steps.rel.outputs.name }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "构建版本: ${APP_VERSION} (${APP_VERSION_CODE})"
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Stage APK artifacts (per-ABI + universal)
        if: steps.guard.outputs.present == 'true'
        run: |
          mkdir -p dist
          name="${{ steps.rel.outputs.name }}"
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f")
            abi=$(echo "$base" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            cp "$f" "dist/nodeloc-${abi}-${name}.apk"
          done
          ls -la dist/

      - name: Publish GitHub Release (title = version or short commit)
        if: steps.guard.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.rel.outputs.tag }}"
          NAME="${{ steps.rel.outputs.name }}"
          if [ "${{ steps.rel.outputs.prerelease }}" = "true" ]; then
            FLAGS="--prerelease"
          else
            FLAGS="--latest"
          fi
          gh release create "$TAG" \
            --title "$NAME" \
            --notes "自动构建 · commit ${{ github.sha }}" \
            --target "${{ github.sha }}" \
            $FLAGS \
            dist/*.apk \
          || {
            # Release 已存在:补传资产,并把 pre-release 标记纠正过来
            gh release upload "$TAG" dist/*.apk --clobber
            gh release edit "$TAG" $FLAGS
          }
