name: Build Release APK

on:
  push:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve short commit hash
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Detect Android project (skip until scaffold lands)
        id: guard
        run: echo "present=$([ -f gradlew ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.guard.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.guard.outputs.present == 'true'

      - name: Ensure debug keystore
        if: steps.guard.outputs.present == 'true'
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble release APK
        if: steps.guard.outputs.present == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Stage APK artifacts (per-ABI + universal)
        if: steps.guard.outputs.present == 'true'
        run: |
          mkdir -p dist
          short="${{ steps.sha.outputs.short }}"
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f")
            abi=$(echo "$base" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            cp "$f" "dist/nodeloc-${abi}-${short}.apk"
          done
          ls -la dist/

      - name: Publish GitHub Release (title = short commit)
        if: steps.guard.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ steps.sha.outputs.short }}"
          gh release create "$TAG" \
            --title "${{ steps.sha.outputs.short }}" \
            --notes "自动构建 · commit ${{ github.sha }}" \
            --target "${{ github.sha }}" \
            dist/*.apk \
          || gh release upload "$TAG" dist/*.apk --clobber
